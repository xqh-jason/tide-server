services:
  mysql:
    image: mysql:8
    container_name: salvo-vben-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salvo_vben
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7
    container_name: salvo-vben-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
