name: ci

on:
  push:
    branches: [main]
    # 版本 tag 也触发：打出的 tag 要对得起它指向的提交。没有这条的话，tag
    # 从未经过任何校验——2026-09-18 就实际踩到：tag 打好后才发现该提交在
    # `-D warnings` 下不干净（clippy 告警），只能删 tag 重打。
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # 测试与迁移统一连自管 MySQL（host 网络直连，见 test job 的排障记录）。
  # 用 127.0.0.1 而非 localhost：排除 IPv6 解析歧义（::1 在部分运行器上不可靠）。
  TIDE_DATABASE__URL: "mysql://root:root@127.0.0.1:3306/tide_server?charset=utf8mb4&timezone=%2B08:00"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 钉住 Rust 工具链
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 两个 crate（根 + migrations）共享同一 target，无需按 crate 细分缓存
          workspaces: . -> target

      - name: rustfmt 格式校验
        run: |
          cargo fmt --check
          (cd migrations && cargo fmt --check)

      - name: clippy 静态检查（含测试代码）
        run: |
          cargo clippy --all-targets -- -D warnings
          (cd migrations && cargo clippy --all-targets -- -D warnings)

  test:
    name: 真库集成测试
    runs-on: ubuntu-latest
    # 兜底：正常全程约 10 分钟；防运行器故障时长时间空转
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 双保险：测试连库地址有两条来源——TIDE_DATABASE__URL（优先）与
      # config.toml 回落值。把回落值也对齐 CI，即使进程环境被测试操纵，
      # 回落路径也指向可达库。（根因见 infra/config.rs tests 注释：env 测试
      # 旧写法会把注入的变量清掉。）
      - name: config.toml 库地址对齐 CI（localhost:3307 → 127.0.0.1:3306）
        run: sed -i 's|localhost:3307|127.0.0.1:3306|' config.toml

      - name: 钉住 Rust 工具链
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # 自管 MySQL（host 网络直连）：mysqld 直接绑定宿主网络命名空间，
      # 127.0.0.1:3306 为本机回环直连，不经过 docker-proxy / 端口发布层，
      # 连接路径与本地 cargo run 同构。
      # （2026-09-12/13 连库故障根因是 config 域 env 测试污染进程环境变量，
      # 详见 infra/config.rs tests 与上方 config.toml 对齐步骤；host 网络
      # 并非该故障的修复手段，保留以减少对端口发布层的依赖。）
      - name: 启动 MySQL 8（host 网络，回环直连）
        run: |
          docker run -d --name mysql --network host \
            -e TZ=Asia/Shanghai \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=tide_server \
            mysql:8 \
            --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

      # 先编译测试二进制（无需数据库）：编译约 3 分钟，MySQL 首次初始化约 20s，
      # 两者时间重叠；探活紧贴迁移/测试执行点，异常时带诊断信息快速失败
      - name: 编译测试二进制
        run: cargo test --no-run

      - name: 探活 MySQL（宿主回环直连）
        run: |
          probe() {
            if command -v mysqladmin >/dev/null 2>&1; then
              mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --connect-timeout=3 >/dev/null 2>&1
            else
              timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/3306' 2>/dev/null
            fi
          }
          for i in $(seq 1 30); do
            if probe; then
              echo "MySQL 就绪（第 ${i} 次探测通过）"
              exit 0
            fi
            echo "第 ${i} 次探测失败，2s 后重试..."
            sleep 2
          done
          echo "::error::宿主机无法连通 127.0.0.1:3306（MySQL 未就绪或异常）"
          docker ps -a
          docker logs mysql | tail -50
          exit 1

      - name: 应用迁移建表
        run: |
          # migrations 为独立 crate；config.toml 默认 3307 已被 env 覆盖到 3306
          cd migrations && DATABASE_URL="$TIDE_DATABASE__URL" cargo run -- up && cd ..

      # 诊断探针（2026-09-13 排障遗留，保留作回归哨兵）：迁移后再探活 +
      # 单测 --nocapture 直出真实报错——连库层异常时 30 秒内快速失败并附
      # mysqld 日志，不再等全量 30 分钟超时后才能看到失败详情。
      - name: 诊断：迁移后再探活 + 单测连库直出真实报错
        run: |
          echo '--- 迁移后再探活（vm → mysqld 可达性对照）---'
          if command -v mysqladmin >/dev/null 2>&1; then
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --connect-timeout=3 \
              || echo '::warning::此刻探活已失败——连接层在迁移成功之后中断'
          else
            timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/3306' 2>/dev/null \
              || echo '::warning::此刻 TCP 探活已失败——连接层在迁移成功之后中断'
          fi
          echo '--- 单测连库（--nocapture 直出 panic）---'
          if ! cargo test ensure_seed_api_is_idempotent -- --nocapture --test-threads=1; then
            echo '::error::单个连库测试失败：上方 panic 即真实错误'
            docker ps -a
            docker logs mysql 2>&1 | tail -100 || true
            ss -ltnp | grep 3306 || true
            exit 1
          fi

      - name: 跑全量测试
        run: cargo test

      - name: 失败诊断：容器状态与 mysqld 日志
        if: failure()
        run: |
          docker ps -a
          docker logs mysql 2>&1 | tail -100 || true
