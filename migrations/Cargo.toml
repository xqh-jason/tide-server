[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt", "rt-multi-thread"] }

[dependencies.sea-orm-migration]
version = "1.1.0"
features = ["runtime-tokio", "sqlx-mysql"]
