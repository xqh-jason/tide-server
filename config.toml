[server]
host = "0.0.0.0"
port = 8080

[database]
# charset=utf8mb4 必须：否则中文（菜单名/昵称等）经 sqlx 读取会乱码
# timezone=%2B08:00（即 +08:00）必须：sqlx 默认强制会话时区为 UTC，不加则
# CURRENT_TIMESTAMP 默认值按 UTC 落库，时间会差 8 小时
url = "mysql://root:root@localhost:3307/tide_server?charset=utf8mb4&timezone=%2B08:00"
# 是否把每条 SQL 打到控制台；调 SQL 时临时改为 true
log_sql = false

[cors]
# 默认拒绝所有跨源（与代码里的 Default 一致）。本项目前后端始终同源：开发走 Vite proxy，
# 生产走 nginx 的 /api 反代，浏览器侧没有跨源请求，因此这里保持空列表。
# 确需跨源直连时按真实来源逐条加入（精确匹配，不支持 `*`）；注意 refresh token 是
# SameSite=Lax 的 HttpOnly Cookie，跨站直连带不上，还需同步评估 allow_credentials。
allow_origins = []
# 允许的 HTTP 方法（缺省已含常用方法，可按需覆盖）
allow_methods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
# 允许的请求头（缺省含 JSON 与鉴权头，可按需覆盖）
allow_headers = ["Content-Type", "Authorization"]
# 是否允许携带凭据（Cookie）。前端用 token 鉴权，默认关闭更安全。
allow_credentials = false
# 预检结果缓存秒数
max_age = 3600

[jwt]
# 开发密钥；不要用于任何公网部署。
# 覆盖方式：环境变量 TIDE_JWT__SECRET（部署环境用强随机串）。
# 注意：非 development 档位仍用此默认值时，服务会拒绝启动（fail-fast）。
secret = "dev-secret-change-me"
# access token 2 小时；过期由前端静默调 /auth/refresh 续期
ttl_seconds = 7200
# refresh token（会话）7 天；存 HttpOnly Cookie，服务端可吊销
refresh_ttl_seconds = 604800

[upload]
# 文件落盘目录（相对进程工作目录或绝对路径均可），生产与本地一致
dir = "./uploads"
# 单文件大小上限（MB）
max_size_mb = 10
# 扩展名白名单（小写、去点；service 校验依据）
allows = [
  "png",
  "jpg",
  "jpeg",
  "gif",
  "svg",
  "pdf",
  "doc",
  "docx",
  "xls",
  "xlsx",
  "ppt",
  "pptx",
  "txt",
  "zip",
]

[log_retention]
# 四个清理任务各自的保留天数；0 = 永久保留（对应任务跳过清理，不删任何记录）。
# 环境变量覆盖：TIDE_LOG_RETENTION__LOGIN_LOG_DAYS=365 等。
#
# 为什么分开配置：它们的审计价值与体量增长不同——过期会话过期即不可用
# （保留仅供审计「谁被何时下线」），而审计日志是合规证据，往往需要更长窗口。
operation_log_days = 90
login_log_days = 90
job_log_days = 90
refresh_token_days = 30
