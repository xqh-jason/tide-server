[server]
host = "0.0.0.0"
port = 8080

[database]
# charset=utf8mb4 必须：否则中文（菜单名/昵称等）经 sqlx 读取会乱码
# timezone=%2B08:00（即 +08:00）必须：sqlx 默认强制会话时区为 UTC，不加则
# CURRENT_TIMESTAMP 默认值按 UTC 落库，时间会差 8 小时
url = "mysql://root:root@localhost:3307/salvo_vben?charset=utf8mb4&timezone=%2B08:00"
# 是否把每条 SQL 打到控制台；调 SQL 时临时改为 true
log_sql = false

[jwt]
# 开发密钥；生产环境务必用 config.local.toml 或环境变量覆盖
secret = "dev-secret-change-me"
ttl_seconds = 604800            # 7 天

[upload]
# 文件落盘目录（相对进程工作目录或绝对路径均可），生产与本地一致
dir = "./uploads"
# 单文件大小上限（MB）
max_size_mb = 10
# 扩展名白名单（小写、去点；service 校验依据）
allows = [
  "png",
  "jpg",
  "jpeg",
  "gif",
  "svg",
  "pdf",
  "doc",
  "docx",
  "xls",
  "xlsx",
  "ppt",
  "pptx",
  "txt",
  "zip",
]
# 断点续传：整文件大小上限（MB），独立于普通上传的 max_size_mb
resumable_max_size_mb = 500
# 断点续传：单分片大小上限（MB）
chunk_max_size_mb = 10
# 分片保留时长（小时）：超时未合并的分片由定时任务 chunk_cleanup 清理
chunk_retain_hours = 24
