[package]
name = "tide-server"
version = "0.1.0"
edition = "2024"

# 工程化基线：CI 与本地共用同一套 lints 口径
# （cargo clippy --all-targets 与 CI 的 -D warnings 叠加生效）
[lints.rust]
# deny 而非 forbid：config.rs 测试模块需操纵进程环境变量（edition 2024 中
# std::env::set_var/remove_var 为 unsafe），以模块级 #[allow] 局部放行；
# 生产代码仍受此 lint 约束，禁止引入 unsafe。
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"    # 业务与测试统一走 anyhow/?；unwrap 一律 deny（含 expect 语义之外的懒散解包）
expect_used = "deny"    # 同上；确需中断语义时用 anyhow::bail 或显式 panic!（带中文说明）
dbg_macro = "deny"      # 调试宏不得入库
todo = "deny"           # todo!() 占位只允许存在于计划骨架阶段，工程化后禁止

[dependencies]
# Web 框架（oapi: #[endpoint] OpenAPI 契约；状态注入用手写中间件，见 src/middleware）
# 注：affix-state feature 依赖 salvo_extra 0.95.2，rsproxy 镜像暂无该版本，故手写等价实现
salvo = { version = "0.95", features = ["oapi"] }
# 异步运行时（锁定安全版本）
tokio = { version = "1.44.2", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 反序列化错误带字段路径（请求体校验提示定位具体字段）
serde_path_to_error = "0.1"
# 日志（锁定安全版本）
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# 错误处理：库内用 thiserror，应用层用 anyhow
thiserror = "2"
anyhow = "1"
# 配置
config = "0.15"
# ORM（MySQL + tokio 运行时 + 宏 + chrono/JSON 类型）
sea-orm = { version = "1", features = [
    "sqlx-mysql",
    "runtime-tokio",
    "macros",
    "with-chrono",
    "with-json",
] }
chrono = { version = "0.4.20", features = ["serde"] }
# 文件上传：存储名 <uuid v4>.<ext> 生成（simple hex，防覆盖与路径穿越）
uuid = { version = "1", features = ["v4"] }
# 图形验证码：4 位数字 PNG 渲染（含扭曲/噪点 filter）
captcha = "1"
# 密码哈希（注册/登录共用）
argon2 = "0.5"
# JWT（签发/校验）。10.x 必须显式指定一个加密提供者：
# rust_crypto（纯 Rust）用于 HS256 足够，无需系统依赖。
jsonwebtoken = { version = "10", default-features = false, features = [
    "rust_crypto",
] }
# refresh token 落库哈希（SHA-256 hex；lock 已有传递依赖 0.10.9，不产生新下载）
sha2 = "0.10"
# 内存缓存实现（token 黑名单）
dashmap = "6"
tokio-cron-scheduler = "0.15.1"
# Future 扩展：调度执行体对 handler 做 poll 级 panic 捕获（已是传递依赖零新增下载）
futures-util = "0.3"
