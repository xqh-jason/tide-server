[package]
name = "salvo-vben-admin"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web 框架（oapi: #[endpoint] OpenAPI 契约；状态注入用手写中间件，见 src/middleware）
# 注：affix-state feature 依赖 salvo_extra 0.95.2，rsproxy 镜像暂无该版本，故手写等价实现
salvo = { version = "0.95", features = ["oapi"] }
# 异步运行时（锁定安全版本）
tokio = { version = "1.44.2", features = ["full"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 反序列化错误带字段路径（请求体校验提示定位具体字段）
serde_path_to_error = "0.1"
# 日志（W1 第一天引入，锁定安全版本）
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# 错误处理：库内用 thiserror，应用层用 anyhow
thiserror = "2"
anyhow = "1"
# 配置
config = "0.15"
# ORM（MySQL + tokio 运行时 + 宏 + chrono/JSON 类型）
sea-orm = { version = "1", features = [
    "sqlx-mysql",
    "runtime-tokio",
    "macros",
    "with-chrono",
    "with-json",
] }
chrono = { version = "0.4.20", features = ["serde"] }
# W5-4 文件上传：存储名 <uuid v4>.<ext> 生成（simple hex，防覆盖与路径穿越）
uuid = { version = "1", features = ["v4"] }
# W5-5 图形验证码：4 位数字 PNG 渲染（含扭曲/噪点 filter）
captcha = "1"
# 密码哈希（W2 认证底座：注册/登录共用）
argon2 = "0.5"
# JWT（W2 认证：签发/校验）。10.x 必须显式指定一个加密提供者：
# rust_crypto（纯 Rust）用于 HS256 足够，无需系统依赖。
jsonwebtoken = { version = "10", default-features = false, features = [
    "rust_crypto",
] }
# 内存缓存实现（W2 token 黑名单；对照 GVA_CACHE 抽象理念）
dashmap = "6"
tokio-cron-scheduler = "0.15.1"
# Future 扩展：调度执行体对 handler 做 poll 级 panic 捕获（W6-2，已是传递依赖零新增下载）
futures-util = "0.3"


# W2/W3 再加：
# reqwest = { version = "0.12", features = ["json"] }       # W7+ AI 延伸
